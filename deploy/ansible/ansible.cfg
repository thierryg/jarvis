[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
# Human-readable task output with timings.
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# Facts are cached per host for faster re-runs (check mode, postflight only).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 3600
# Python on Ubuntu 26.04 is /usr/bin/python3.
interpreter_python = auto_silent
host_key_checking = True
# Run the notified handlers even when a later task fails: a re-run then never misses a
# restart or reload that was due (e.g. sysctl, nginx, sshd).
force_handlers = True
retry_files_enabled = False
nocows = True
forks = 5
timeout = 30

[privilege_escalation]
become = True
become_method = ansible.builtin.sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
