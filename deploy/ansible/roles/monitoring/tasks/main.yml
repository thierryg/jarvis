- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
  when: jarvis_with_monitoring | bool

# jarvis-monitoring.path applies the choice made in Settings > Monitoring (as root).
- name: Leave node_exporter to the web UI setting
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: false
    state: stopped
  when: jarvis_with_monitoring | bool
