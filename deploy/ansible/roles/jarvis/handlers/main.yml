- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload udev
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=tty --subsystem-match=hidraw
  changed_when: true
  when: not jarvis_in_container

# Only restarts what already runs: the services role starts everything at the end.
# try-restart (restart only if running) has no equivalent in the systemd_service module.
- name: Restart jarvis
  ansible.builtin.command: systemctl try-restart jarvis-api.service jarvis-core.service  # noqa: command-instead-of-module
  changed_when: true
