# Existing sessions (including this Ansible connection) survive a restart of sshd.
# On Ubuntu the port comes from ssh.socket, regenerated from sshd_config by a systemd generator.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
    daemon_reload: true
