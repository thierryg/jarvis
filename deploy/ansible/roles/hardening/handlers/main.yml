- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not jarvis_in_container
