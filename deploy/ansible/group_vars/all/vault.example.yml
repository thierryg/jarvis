# =============================================================================
#   cp vault.example.yml vault.yml && ansible-vault encrypt vault.yml
#   ./jarvis-deploy.sh deploy --ask-vault-pass
# vault.yml is ignored by git. Every value below is written to /etc/jarvis/jarvis.env
# (root:jarvis 0640) and never printed (no_log).
jarvis_secrets:
  JARVIS__SECRETS__CAMERA_USERNAME: "jarvis"
  JARVIS__SECRETS__CAMERA_PASSWORD: "change-me"
  # JARVIS__SECRETS__METRICS_TOKEN: "long-random-token"
  # JARVIS__SECRETS__MQTT_USERNAME: "jarvis"
  # JARVIS__SECRETS__MQTT_PASSWORD: "change-me"
  # JARVIS__SECRETS__MQTT_COMMAND_TOKEN: "long-random-token"

# Let's Encrypt DNS-01 plugin credentials (jarvis_tls_mode: letsencrypt), e.g. Cloudflare:
# jarvis_le_dns_credentials: |
#   dns_cloudflare_api_token = 0123456789abcdef
