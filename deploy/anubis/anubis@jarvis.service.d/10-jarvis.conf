# /etc/systemd/system/anubis@jarvis.service.d/10-jarvis.conf
[Unit]
Description=Anubis anti-bot proxy in front of the Jarvis web API
After=network.target jarvis-api.service
PartOf=jarvis.target

[Service]
# The key stays root:root 0600 on disk; systemd copies it into a private credentials
# directory ($CREDENTIALS_DIRECTORY, %d) readable only by the dynamic service user.
LoadCredential=ed25519.key:/etc/anubis/jarvis.key
Environment=ED25519_PRIVATE_KEY_HEX_FILE=%d/ed25519.key
# Resource accounting (MOTD, systemctl status).
CPUAccounting=yes
MemoryAccounting=yes
IOAccounting=yes
IPAccounting=yes
# Hardening on top of DynamicUser=yes: loopback-only network service, no privilege at all.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
UMask=0077
