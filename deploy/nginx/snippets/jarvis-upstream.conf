# /etc/nginx/snippets/jarvis-upstream.conf - generated per host, kept on upgrade.
# With Anubis (deploy/ansible, anubis_enabled: true) the server is 127.0.0.1:8923.
upstream jarvis_front {
    server 127.0.0.1:8000;
    keepalive 16;
}
