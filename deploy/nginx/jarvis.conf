# /etc/nginx/sites-available/jarvis.conf  (symlink it into sites-enabled/)
#
# Request path:
#   client -> nginx :443 -> jarvis_front -> API 127.0.0.1:8000 -> (unix socket) jarvis-core
# jarvis_front is Anubis (127.0.0.1:8923, anti-bot proof-of-work) when it is installed,
# otherwise the API itself. The two host-specific values live in generated snippets, so this
# file is identical on every host (written by deploy/ansible or scripts/jarvis-install.sh):
#   /etc/nginx/snippets/jarvis-upstream.conf     upstream jarvis_front { server ...; }
#   /etc/nginx/snippets/jarvis-server-name.conf  server_name ...;
include /etc/nginx/snippets/jarvis-upstream.conf;

# The API itself: used directly by the long-lived stream and the Prometheus scrape.
upstream jarvis_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Login rate limiting: 10 requests/minute per client IP (brute-force mitigation).
limit_req_zone $binary_remote_addr zone=jarvis_login:10m rate=10r/m;

# AI crawlers, AI agents and search-engine robots are refused outright (403) by user agent,
# before reaching Anubis (which also denies them, and challenges anything browser-like).
map $http_user_agent $jarvis_denied_bot {
    default 0;
    "~*(gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|claude-user|claude-searchbot|anthropic-ai|ccbot|google-extended|googleother|perplexity|bytespider|amazonbot|applebot|meta-externalagent|meta-externalfetcher|facebookbot|facebookexternalhit|diffbot|cohere-ai|youbot|imagesiftbot|omgili|timpibot|ai2bot|mistralai-user|duckassistbot|petalbot|googlebot|bingbot|msnbot|duckduckbot|baiduspider|yandex|qwantbot|seznambot|semrushbot|ahrefsbot|mj12bot|dotbot|ia_archiver|archive\.org_bot)" 1;
}

# Plain HTTP: permanent redirect to HTTPS, except the ACME HTTP-01 challenge files written by
# "jarvis-cert issue --mode letsencrypt --challenge http" (the default DNS-01 needs no port 80).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    include /etc/nginx/snippets/jarvis-server-name.conf;

    # Dedicated logs: the access log feeds the fail2ban "jarvis-login" jail (401/429 on /api/login).
    access_log /var/log/nginx/jarvis.access.log;
    error_log  /var/log/nginx/jarvis.error.log warn;

    # Managed by jarvis-cert (scripts/jarvis-cert.sh): local CA or Let's Encrypt, same paths.
    ssl_certificate     /etc/jarvis/tls/jarvis.crt;
    ssl_certificate_key /etc/jarvis/tls/jarvis.key;
    # TLS 1.2+ only; let modern clients pick the cipher suite.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jarvis:10m;

    # Security headers ("always" also adds them to error responses):
    #  - HSTS: browsers must use HTTPS for one year;
    #  - nosniff: no MIME type sniffing;
    #  - X-Frame-Options/frame-ancestors: no framing (clickjacking protection);
    #  - Referrer-Policy: never leak URLs to other origins;
    #  - Permissions-Policy: microphone allowed for this origin only, no camera/geolocation;
    #  - CSP: same-origin resources only; blob:/data: allowed for in-page images and media.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # Never indexed, cached, archived, translated or used for snippets by any robot.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;
    # No shared caches: every response is private to the logged-in user.
    add_header Cache-Control "no-store" always;
    # Do not advertise the nginx version.
    server_tokens off;

    # Denied robots (see the map above). No add_header inside locations: it would drop the
    # server-level security headers (nginx inheritance rule).
    if ($jarvis_denied_bot) {
        return 403;
    }

    # Robots exclusion for well-behaved crawlers: nothing may be crawled.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Maximum request body size (file uploads).
    client_max_body_size 16m;

    # Forward the original client address and scheme to the API.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep-alive connections to the upstreams.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Login endpoint, rate-limited (burst of 5, excess rejected immediately; 429 for fail2ban).
    limit_req_status 429;
    location = /api/login {
        limit_req zone=jarvis_login burst=5 nodelay;
        proxy_pass http://jarvis_front;
    }

    # Live MJPEG stream: straight to the API (session-checked there), no buffering, long-lived.
    location = /api/stream.mjpg {
        proxy_pass http://jarvis_api;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Live log tail (Server-Sent Events): straight to the API (session-checked there), no buffering.
    location = /api/logs/stream {
        proxy_pass http://jarvis_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Prometheus scrape: straight to the API (bearer token + source address checked there).
    location = /metrics {
        proxy_pass http://jarvis_api;
    }

    location / {
        proxy_pass http://jarvis_front;
    }
}
