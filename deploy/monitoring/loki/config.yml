# Single-instance Loki (local filesystem storage), 90-day retention.
# No authentication: keep port 3100 reachable from the LAN only.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
# 2160h = 90 days; the compactor enforces the retention and deletes expired chunks.
limits_config:
  retention_period: 2160h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
