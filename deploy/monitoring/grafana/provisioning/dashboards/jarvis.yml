# Dashboard JSON files mounted at /var/lib/grafana/dashboards go into the "Jarvis" folder.
apiVersion: 1
providers:
  - name: jarvis
    folder: Jarvis
    type: file
    options:
      path: /var/lib/grafana/dashboards
