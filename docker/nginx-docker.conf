# File    : docker/nginx-docker.conf
# Purpose : nginx TLS reverse proxy for the Docker Compose deployment
# Author  : Thierry Gayet <thierry.gayet@labworks.fr>
# Project : jarvis-home (version: jarvis/VERSION)
# Copyright (c) 2026 Thierry Gayet. SPDX-License-Identifier: 0BSD
# =============================================================================
# Login rate limiting: 10 requests/minute per client IP (brute-force mitigation).
limit_req_zone $binary_remote_addr zone=jarvis_login:10m rate=10r/m;

# Plain HTTP: permanent redirect to HTTPS only.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jarvis.local;

    # Managed on the host by jarvis-cert (scripts/jarvis-cert.sh): local CA or Let's Encrypt.
    ssl_certificate     /etc/jarvis/tls/jarvis.crt;
    ssl_certificate_key /etc/jarvis/tls/jarvis.key;
    # TLS 1.2+ only; let modern clients pick the cipher suite.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jarvis:10m;

    # Security headers ("always" also adds them to error responses):
    #  - HSTS: browsers must use HTTPS for one year;
    #  - nosniff: no MIME type sniffing;
    #  - X-Frame-Options/frame-ancestors: no framing (clickjacking protection);
    #  - Referrer-Policy: never leak URLs to other origins;
    #  - Permissions-Policy: microphone allowed for this origin only, no camera/geolocation;
    #  - CSP: same-origin resources only; blob:/data: allowed for in-page images and media.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Maximum request body size (file uploads).
    client_max_body_size 16m;

    # Forward the original client address and scheme to the API.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login endpoint, rate-limited (burst of 5, excess rejected immediately).
    location = /api/login {
        limit_req zone=jarvis_login burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    # Live MJPEG stream: no buffering, long-lived connection.
    location = /api/stream.mjpg {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://api:8000;
    }
}
