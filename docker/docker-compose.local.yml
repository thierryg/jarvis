# =============================================================================
# Jarvis - Local smart gatekeeper (PTZ camera, face & voice recognition)
# -----------------------------------------------------------------------------
# File    : docker/docker-compose.local.yml
# Purpose : Self-contained Compose project to try Jarvis on a workstation (no host config, no devices)
# Author  : Thierry Gayet <thierry.gayet@labworks.fr>
# Project : jarvis-home (version: jarvis/VERSION)
# Copyright (c) 2026 Thierry Gayet. SPDX-License-Identifier: 0BSD
# =============================================================================
# Driven by docker/jarvis-start.sh, jarvis-status.sh, jarvis-stop.sh and jarvis-clean.sh (project name "jarvis-local").
# Everything host-specific lives in docker/.local/ (generated by jarvis-start.sh, ignored by git):
#   config.yaml   copy of config/config.example.yaml (edit it freely, it is kept)
#   jarvis.env    local overrides: simulated relay/LEDs, no audio, API on the Compose network
#   tls/          certificate from a private "Jarvis Local CA" (scripts/jarvis-cert.sh, local mode)
# Only nginx is published, on non-privileged ports: https://localhost:${JARVIS_HTTPS_PORT:-8443}/.
# No USB relay, microphone or door sensor is passed through: the relay and LEDs are simulated
# ("mock" backend, visible in the logs) and the voice assistant is off.

name: jarvis-local

x-common: &common
  build: {context: .., dockerfile: docker/Dockerfile}
  image: jarvis:local
  restart: unless-stopped
  env_file:
    # Optional so that status/stop/clean also work before the first start (or after --purge).
    - {path: .local/jarvis.env, required: false}
  volumes:
    - ./.local/config.yaml:/etc/jarvis/config.yaml:ro
    - data:/var/lib/jarvis
    - run:/run/jarvis
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  # Core: camera, vision, decision (no hardware: simulated outputs).
  core:
    <<: *common
    command: ["core"]
    healthcheck:
      # The control socket appears once the core is ready.
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/run/jarvis/core.sock') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Web API: talks to the core through the socket of the shared "run" volume.
  api:
    <<: *common
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ui', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # TLS reverse proxy: the only published service.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JARVIS_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${JARVIS_HTTP_PORT:-8080}:80"
    volumes:
      - ./.local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/tls/jarvis.crt:/etc/jarvis/tls/jarvis.crt:ro
      - ./.local/tls/jarvis.key:/etc/jarvis/tls/jarvis.key:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/api/ui"]
      interval: 10s
      timeout: 5s
      retries: 6

# Network created by jarvis-start.sh (default Docker pools, or a free /24 when the daemon's pools
# are exhausted, or JARVIS_DOCKER_SUBNET), removed by jarvis-clean.sh.
networks:
  default:
    name: jarvis-local-net
    external: true

volumes:
  data:   # database, models, snapshots, recordings (kept by jarvis-stop.sh, removed by jarvis-clean.sh --volumes)
  run:    # control socket, preview frame
